# mappings.conf — AI Config Manager source-to-target file mappings
#
# Format:  source_path : destination_path
#   - source_path:      relative to the repo root (this directory)
#   - destination_path: relative to $HOME/.<tool>/
#
# Sections: [claude], [codex], [gemini]
# Lines starting with # are comments. Inline comments are also supported.

# ══════════════════════════════════════════════════════════════════════════════
# CLAUDE — Full install (this repo is the Claude Code config source)
# ══════════════════════════════════════════════════════════════════════════════
[claude]
core/shared/agent-specs/             : agents/
core/shared/guidance/modes/          : modes/
core/shared/guidance/rules/          : rules/
core/shared/guidance/mcp/            : mcp/
core/shared/guidance/references/     : references/
core/shared/scripts/                 : scripts/
core/shared/skills/                  : skills/
core/shared/templates/               : templates/
core/harnesses/claude/hooks/         : hooks/
core/harnesses/claude/settings/settings.json    : settings.json
core/harnesses/claude/settings/keybindings.json : keybindings.json
core/shared/guidance/CLAUDE.md       : CLAUDE.md
core/shared/guidance/FLAGS.md        : FLAGS.md
core/shared/guidance/PRINCIPLES.md   : PRINCIPLES.md
# core/.mcp.json is NOT mapped here — Claude Code never reads .claude/.mcp.json. It's installed
# by src/mcp.js instead, straight to the locations Claude Code actually resolves MCP servers from:
# global -> ~/.claude.json's `mcpServers` key (merged); project scope -> <projectRoot>/.mcp.json.

# ══════════════════════════════════════════════════════════════════════════════
# CODEX — Native AGENTS.md instructions and reusable skills, plus shared guidance
# ══════════════════════════════════════════════════════════════════════════════
[codex]
core/shared/guidance/rules/      : rules/
core/shared/agent-specs/         : agents/
core/shared/guidance/references/ : references/
core/shared/skills/              : skills/
core/shared/scripts/             : scripts/
core/shared/templates/           : templates/
core/shared/guidance/CLAUDE.md   : AGENTS.md
core/shared/guidance/FLAGS.md    : FLAGS.md
core/shared/guidance/PRINCIPLES.md : PRINCIPLES.md
# Native Codex config.toml, hooks.json, and hook wrappers are intentionally not
# copier mappings. Their registry nativeProjection is reconciled by the Codex
# adapter, which preserves foreign configuration and owns executable deployment.

# ══════════════════════════════════════════════════════════════════════════════
# GEMINI — Subset: tool-agnostic rules, agents, and reference material
# ══════════════════════════════════════════════════════════════════════════════
[gemini]
core/shared/guidance/rules/      : rules/
core/shared/agent-specs/         : agents/
core/shared/guidance/modes/      : modes/
core/shared/skills/              : skills/
core/shared/guidance/references/ : references/
core/shared/guidance/FLAGS.md    : FLAGS.md
core/shared/guidance/PRINCIPLES.md : PRINCIPLES.md
# Native GEMINI.md instructions are intentionally not a copier mapping. The registry's
# guidance.core asset is reconciled by the Gemini adapter (src/adapters/gemini), which owns a
# managed marker section rather than a whole-file overwrite. See core/registry/harnesses.yaml
# (nativeTargets.instructions = GEMINI.md) and https://geminicli.com/docs/cli/gemini-md/.
