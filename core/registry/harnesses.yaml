      "displayName": "GitHub Copilot CLI",
      "adapter": "copilot",
      "scopes": [
        "project",
        "user"
      ],
      "nativeTargets": {
        "instructions": ".github/copilot-instructions.md",
        "agents": ".github/agents",
        "mcp": ".mcp.json"
      },
      "capabilities": {
        "instructions": {
          "status": "supported",
          "evidence": [
            "https://docs.github.com/en/copilot/how-tos/copilot-cli/customize-copilot"
          ],
          "verification": "Confirm .github/copilot-instructions.md is loaded by Copilot CLI; no documented global-instructions equivalent exists beyond the shared, generic AGENTS.md file."
        },
        "skills": {
          "status": "supported",
          "evidence": [
            "https://docs.github.com/en/copilot/how-tos/copilot-cli/customize-copilot/add-skills"
          ],
          "verification": "Confirm Copilot CLI discovers the installed skill from .agents/skills (project) or ~/.agents/skills (personal) \u2014 the same SKILL.md + YAML frontmatter format DoFlow already authors, so no per-harness transformation is required."
        },
        "agents": {
          "status": "supported",
          "evidence": [
            "https://docs.github.com/en/copilot/how-tos/copilot-cli/customize-copilot/create-custom-agents-for-cli",
            "https://docs.github.com/en/copilot/reference/custom-agents-configuration"
          ],
          "note": "The on-disk agent file format is `.agent.md` with YAML frontmatter, confirmed against the custom-agents-configuration reference: a required `description`, optional `name`, `tools`, `model`, `disable-model-invocation`, `user-invocable`, `mcp-servers`, and `metadata` fields, with the Markdown body below the frontmatter as the agent's instructions. The adapter renames each core/shared/agent-specs/<name>.md file to <name>.agent.md via copy-tree's layout mechanism on the way out; unrecognized frontmatter keys pass through untouched, the same posture Claude/Codex/Gemini's agent projections already take.",
          "verification": "Confirm an installed custom agent under ~/.copilot/agents or .github/agents is discoverable and selectable by Copilot CLI."
