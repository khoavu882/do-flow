    {
      "id": "opencode",
      "displayName": "OpenCode",
      "adapter": "opencode",
      "scopes": [
        "project",
        "user"
      ],
      "nativeTargets": {
        "instructions": "AGENTS.md",
        "settings": "opencode.json",
        "mcp": "opencode.json"
      },
      "capabilities": {
        "instructions": {
          "status": "supported",
          "evidence": [
            "https://opencode.ai/docs/rules"
          ],
          "verification": "Confirm AGENTS.md is loaded, and that opencode.json instructions[] pulls in the DoFlow guidance pointer."
        },
        "skills": {
          "status": "supported",
          "evidence": [
            "https://opencode.ai/docs/skills",
            "https://opencode.ai/docs/rules"
          ],
          "verification": "Confirm OpenCode discovers DoFlow skills from the registered directory rather than a copied tree."
        },
        "agents": {
          "status": "different",
          "evidence": [
            "https://opencode.ai/docs/config"
          ],
          "note": "OpenCode defines agents in its own config rather than as standalone spec files, so DoFlow projects agent guidance through instructions instead of a native agents directory.",
          "verification": "Report that agent guidance arrives via instructions, not a native agent registry."
        },
        "scripts": {
          "status": "supported",
          "evidence": [
            "https://opencode.ai/docs/skills"
          ],
          "verification": "Confirm a bundled skill scripts/ directory is reachable from the registered skills path."
        },
        "templates": {
          "status": "supported",
          "evidence": [
            "https://opencode.ai/docs/rules"
          ],
          "verification": "Confirm the installed template tree is readable by the agent."
        },
        "modes": {
          "status": "different",
          "evidence": [
            "https://opencode.ai/docs/rules"
          ],
          "note": "OpenCode has no separate mode surface; DoFlow mode guidance is reachable through the instructions pointer.",
          "verification": "Confirm mode guidance is available through instructions."
        },
        "settings": {
          "status": "supported",
          "evidence": [
            "https://opencode.ai/docs/config"
          ],
          "verification": "Confirm opencode.json retains user keys and only DoFlow-owned entries change."
        },
        "hooks": {
          "status": "different",
          "evidence": [
            "https://opencode.ai/docs/plugins"
          ],
          "note": "OpenCode extends behaviour through JavaScript/TypeScript plugin modules, not the shell hook scripts DoFlow ships, so no hook projection is attempted.",
          "verification": "Report that DoFlow installs no OpenCode plugin and its shell hooks do not apply here.",
          "events": {
            "PreToolUse": {
              "status": "different",
              "note": "DoFlow projects shell hooks; OpenCode requires a code module, so no hook is installed. Native equivalent: tool.execute.before."
            },
            "PostToolUse": {
              "status": "different",
              "note": "DoFlow projects shell hooks; OpenCode requires a code module, so no hook is installed. Native equivalent: tool.execute.after."
            },
            "SessionStart": {
              "status": "different",
              "note": "DoFlow projects shell hooks; OpenCode requires a code module, so no hook is installed. Native equivalent: session.created."
            },
            "SessionEnd": {
              "status": "different",
              "note": "DoFlow projects shell hooks; OpenCode requires a code module, so no hook is installed. Native equivalent: session.idle / session.deleted."
            },
            "PreCompact": {
              "status": "different",
              "note": "DoFlow projects shell hooks; OpenCode requires a code module, so no hook is installed. Native equivalent: experimental.session.compacting."
            },
            "PostCompact": {
              "status": "different",
              "note": "DoFlow projects shell hooks; OpenCode requires a code module, so no hook is installed. Native equivalent: session.compacted."
            },
            "PermissionDenied": {
              "status": "different",
              "note": "DoFlow projects shell hooks; OpenCode requires a code module, so no hook is installed. Native equivalent: permission.replied, whose payload carries the decision."
            },
            "Stop": {
              "status": "different",
              "note": "DoFlow projects shell hooks; OpenCode requires a code module, so no hook is installed. Native equivalent: session.idle."
            },
            "UserPromptSubmit": {
              "status": "unavailable",
              "note": "OpenCode exposes message.updated rather than a pre-submission prompt event, so a hook could not gate a prompt before the model sees it."
            },
            "SubagentStart": {
              "status": "unavailable",
              "note": "OpenCode publishes no subagent lifecycle event."
            },
            "SubagentStop": {
              "status": "unavailable",
              "note": "OpenCode publishes no subagent lifecycle event."
            },
            "PostToolUseFailure": {
              "status": "unavailable",
              "note": "tool.execute.after fires for both outcomes; no failure-only event exists."
            },
            "ConfigChange": {
              "status": "unavailable",
              "note": "installation.updated tracks OpenCode upgrades, not configuration edits."
            }
          }
        },
        "mcp": {
          "status": "supported",
          "evidence": [
            "https://opencode.ai/docs/mcp-servers"
          ],
          "verification": "Confirm selected MCP servers appear under the mcp key in opencode.json."
        },
        "plugin": {
          "status": "different",
          "evidence": [
            "https://opencode.ai/docs/plugins"
          ],
          "note": "DoFlow publishes no OpenCode plugin package; its content reaches OpenCode by registration rather than plugin distribution.",
          "verification": "Report that no plugin package is installed for OpenCode."
        }
      }
    },
    {
