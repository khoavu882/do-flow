    {
      "id": "codex",
      "displayName": "Codex",
      "adapter": "codex",
      "scopes": [
        "project",
        "user"
      ],
      "nativeTargets": {
        "instructions": "AGENTS.md",
        "settings": ".codex/config.toml",
        "hooks": ".codex/hooks.json",
        "agents": ".codex/agents/*.toml",
        "mcp": ".codex/config.toml"
