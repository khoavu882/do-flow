        "plugin": {
          "status": "supported",
          "evidence": [
            "https://developers.openai.com/codex/concepts/plugins"
          ],
          "prerequisites": [
            "user-activation"
          ],
          "verification": "Confirm the plugin is enabled by the host."
        }
