            "SessionStart": {
              "status": "supported"
            },
            "SessionEnd": {
              "status": "supported"
            },
            "BeforeTool": {
              "status": "supported"
            },
            "AfterTool": {
              "status": "supported"
            },
            "PreCompress": {
              "status": "supported"
            },
            "UserPromptSubmit": {
              "status": "unavailable",
              "note": "No Gemini equivalent; the nearest native hook is BeforeAgent, which fires once before planning and can block the turn or inject context \u2014 not a per-prompt pre-submission gate."
            },
            "Stop": {
              "status": "unavailable",
              "note": "No exact match; AfterAgent fires at agent-loop end and can halt or retry the turn, which is coarser than Claude's Stop."
            },
            "SubagentStart": {
              "status": "unavailable",
              "note": "BeforeAgent/AfterAgent bracket the whole agent loop; they are not subagent lifecycle events."
            },
            "SubagentStop": {
              "status": "unavailable",
              "note": "BeforeAgent/AfterAgent bracket the whole agent loop; they are not subagent lifecycle events."
            },
            "PostToolUseFailure": {
              "status": "unavailable",
              "note": "AfterTool fires regardless of outcome; failure cannot be isolated."
            },
            "PermissionDenied": {
              "status": "unavailable",
              "note": "Gemini exposes no permission-decision event."
            }
          }
        },
        "mcp": {
          "status": "different",
          "evidence": [
            "https://geminicli.com/docs/tools/mcp-server/"
          ],
          "verification": "Verify only adapter-supported MCP registration."
        },
