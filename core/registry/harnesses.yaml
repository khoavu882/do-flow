    {
      "id": "codex",
      "displayName": "Codex",
      "adapter": "codex",
      "scopes": [
        "project",
        "user"
      ],
      "nativeTargets": {
        "instructions": "AGENTS.md",
        "settings": ".codex/config.toml",
        "hooks": ".codex/hooks.json",
        "agents": ".codex/agents/*.toml",
        "mcp": ".codex/config.toml"
      },
      "nativeProjection": {
        "config": {
          "source": "core/harnesses/codex/config/config.toml",
          "note": "Codex hooks are enabled by default since GA; DoFlow still writes features.hooks=true so older CLI versions that required the opt-in also pick the projection up. The flag now only ever disables (features.hooks=false).",
          "resources": [
            {
              "kind": "configuration-entry",
              "identity": "features.hooks",
              "value": true
            }
          ]
        },
        "mcp": {
          "catalog": "registry.mcp",
          "selection": "optional"
        },
        "agents": {
          "source": "core/harnesses/codex/agents"
        },
        "hooks": {
          "configSource": "core/harnesses/codex/hooks/hooks.json",
          "scriptsSource": "core/harnesses/codex/hooks",
          "trusted": false
        }
      },
      "capabilities": {
        "instructions": {
          "status": "supported",
          "evidence": [
            "https://developers.openai.com/codex/agent-configuration/agents-md"
          ],
          "verification": "Confirm the managed AGENTS.md section is applied at the project root (or ~/.codex/AGENTS.md globally)."
        },
        "skills": {
          "status": "supported",
          "evidence": [
            "https://developers.openai.com/codex/build-skills"
          ],
          "verification": "Confirm Codex discovers the installed skill from .agents/skills (repo scope) or ~/.agents/skills (user scope); Codex never scans .codex/skills."
        },
        "agents": {
          "status": "supported",
          "evidence": [
            "https://developers.openai.com/codex/agent-configuration/subagents"
          ],
          "verification": "Delegate a test task to a custom agent."
        },
        "scripts": {
          "status": "supported",
          "evidence": [
            "https://developers.openai.com/codex/concepts/customization"
          ],
          "verification": "Confirm referenced scripts exist."
        },
        "templates": {
          "status": "supported",
          "evidence": [
            "https://developers.openai.com/codex/concepts/customization"
          ],
          "verification": "Confirm a skill can read its template."
        },
        "modes": {
          "status": "unavailable",
          "evidence": [
            "https://developers.openai.com/codex/concepts/customization"
          ],
          "verification": "Report the capability gap; do not render a native mode."
        },
        "settings": {
          "status": "different",
          "evidence": [
            "https://developers.openai.com/codex/config-file/config-advanced"
          ],
          "prerequisites": [
            "trusted-project"
          ],
          "verification": "Inspect the reconciled config.toml."
        },
        "hooks": {
          "status": "supported",
          "evidence": [
            "https://developers.openai.com/codex/hooks"
          ],
          "prerequisites": [
            "trusted-project",
            "hook-review"
          ],
          "verification": "Review and exercise a mapped hook.",
          "events": {
            "SessionStart": {
              "status": "supported"
            },
            "SessionEnd": {
              "status": "supported"
            },
            "UserPromptSubmit": {
              "status": "supported"
            },
            "Stop": {
              "status": "supported"
            },
            "PreToolUse": {
              "status": "supported"
            },
            "PostToolUse": {
              "status": "supported"
            },
            "SubagentStart": {
              "status": "supported"
            },
            "SubagentStop": {
              "status": "supported"
            },
            "PreCompact": {
              "status": "supported"
            },
            "PostToolUseFailure": {
              "status": "unavailable",
              "note": "No Codex event fires only on tool failure; PostToolUse cannot distinguish the two."
            },
            "PermissionDenied": {
              "status": "unavailable",
              "note": "Codex exposes no permission-decision event."
            }
          }
        },
        "mcp": {
          "status": "supported",
          "evidence": [
            "https://developers.openai.com/codex/extend/mcp"
          ],
          "verification": "Confirm selected MCP servers connect."
