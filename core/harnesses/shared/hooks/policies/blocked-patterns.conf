# blocked-patterns.conf — Dangerous command patterns for pre-bash-guard.sh
#
# Format (TAB-separated):
#   regex<TAB>reason shown to the harness<TAB>exclude_regex (optional)
#
# Rules:
#   - Lines beginning with # are comments (skipped)
#   - Empty lines are skipped
#   - Regex is POSIX Extended Regular Expression (ERE, as used by `grep -E`),
#     matched case-insensitively against the full command string, which
#     includes any expanded heredocs or -m "..." arguments. Git and rm
#     patterns use a command-context anchor:
#       (^|[[:space:]]*(&&|\|\||;)[[:space:]]*)
#     so they only fire when the dangerous text is an actual invocation,
#     not when it appears as text inside a commit message or other argument.
#   - Anchored patterns (those beginning with "(^|") are matched against the
#     command with quoted text blanked out (pre-bash-guard.sh scrub_quotes),
#     so echo "x && rm -rf /" or git commit -m "git reset --hard" is not a
#     command. The argument of sh -c, bash -c, zsh -c and eval is NOT blanked
#     (it executes). Every other pattern is matched against the full text.
#   - The rm lines use a wider command position than the others: start of a
#     line or after ; & | ( or a backtick, then optional sudo/command/time/
#     nohup/exec/env (with options, an option's separate argument as in
#     sudo -u root or xargs -n 1, and VAR=x)/xargs/eval/then/do/else, then rm,
#     \rm, /bin/rm or /usr/bin/rm. "git rm" and "echo rm -rf /" are therefore
#     not matched. pre-bash-guard.sh's hardcoded floor uses the same rule.
#   - The git patterns accept git's global options before the subcommand
#     (git -C dir push, git -c k=v push). The force-push rules block -f (also
#     inside a flag cluster such as -uf), --force and a +refspec; the
#     --force-with-lease form stays allowed, as the reason text advises.
#   - The find rule blocks -delete, and -exec rm, off the root, a home directory
#     or a system directory (among other start paths, find or \find or
#     /usr/bin/find) when only -type, -maxdepth/-mindepth N, -mount, -xdev,
#     -depth, -noleaf, -follow or -ignore_readdir_race follow the path: none of
#     those narrows what is deleted. Any other predicate (-name, -path, -newer,
#     -mtime, -size, -user, -empty ...) counts as scoping, so
#     find ~ -name '*.pyc' -delete is allowed.
#   - SQL patterns are intentionally NOT anchored — DROP/DELETE/TRUNCATE
#     inside heredoc-to-psql pipelines are real execution and must be caught.
#   - The optional third column is an exclude_regex: when present and the
#     command ALSO matches it, the pattern line is skipped (not blocked).
#     This is how negative-lookahead behavior (unsupported in POSIX ERE) is
#     approximated — e.g. "git push --force" blocks force pushes, but the
#     exclude_regex "--force-with-lease" lets that safer variant through.
#   - First matching pattern wins — order matters
#   - A malformed regex on any line is skipped (guard continues safely)
#
# Add project-specific patterns at the bottom of this file.

# ── Dangerous git operations ──────────────────────────────────────────────────
(^|[[:space:]]*(&&|\|\||;)[[:space:]]*)git([[:space:]]+(-[Cc][[:space:]]+[^[:space:];&|]+|--(git-dir|work-tree|namespace|exec-path)[[:space:]]+[^[:space:];&|]+|-[^[:space:];&|]+))*[[:space:]]+push([[:space:]]+[^[:space:];&|]+)*[[:space:]]+(--force|-[a-zA-Z]*f[a-zA-Z]*)([^-[:alnum:]]|$)	Force push blocked — use --force-with-lease or confirm with user first
(^|[[:space:]]*(&&|\|\||;)[[:space:]]*)git([[:space:]]+(-[Cc][[:space:]]+[^[:space:];&|]+|--(git-dir|work-tree|namespace|exec-path)[[:space:]]+[^[:space:];&|]+|-[^[:space:];&|]+))*[[:space:]]+push([[:space:]]+[^[:space:];&|]+)*[[:space:]]+\+[^[:space:];&|]+	Force push blocked — use --force-with-lease or confirm with user first
(^|[[:space:]]*(&&|\|\||;)[[:space:]]*)git([[:space:]]+(-[Cc][[:space:]]+[^[:space:];&|]+|--(git-dir|work-tree|namespace|exec-path)[[:space:]]+[^[:space:];&|]+|-[^[:space:];&|]+))*[[:space:]]+reset --hard	Destructive reset blocked — commit or stash changes before resetting
(^|[[:space:]]*(&&|\|\||;)[[:space:]]*)git([[:space:]]+(-[Cc][[:space:]]+[^[:space:];&|]+|--(git-dir|work-tree|namespace|exec-path)[[:space:]]+[^[:space:];&|]+|-[^[:space:];&|]+))*[[:space:]]+clean -fd	Irreversible clean blocked — use --dry-run to preview what would be deleted

# ── Filesystem catastrophes ───────────────────────────────────────────────────
(^|[;&|(`])[[:space:]]*((sudo|command|time|nohup|exec|env|xargs|eval|then|do|else)([[:space:]]+(-[uCghprtUDRnILPsdEaJSfo][[:space:]]+[^-[:space:];&|][^[:space:];&|]*|-[^[:space:];&|]*|[A-Za-z_][A-Za-z0-9_]*=[^[:space:];&|]*))*[[:space:]]+)*(\\|/(usr/)?bin/)?rm([[:space:]]+[^[:space:];&|]+)*[[:space:]]+((-[a-zA-Z]*[rR][a-zA-Z]*|--recursive)([[:space:]]+[^[:space:];&|]+)*[[:space:]]+(/+\*{0,2})([[:space:];&|)`]|$)|(/+\*{0,2})([[:space:]]+[^[:space:];&|]+)*[[:space:]]+(-[a-zA-Z]*[rR][a-zA-Z]*|--recursive)([[:space:];&|)`]|$))	Catastrophic delete blocked — recursive rm of the root directory (/)
(^|[;&|(`])[[:space:]]*((sudo|command|time|nohup|exec|env|xargs|eval|then|do|else)([[:space:]]+(-[uCghprtUDRnILPsdEaJSfo][[:space:]]+[^-[:space:];&|][^[:space:];&|]*|-[^[:space:];&|]*|[A-Za-z_][A-Za-z0-9_]*=[^[:space:];&|]*))*[[:space:]]+)*(\\|/(usr/)?bin/)?rm([[:space:]]+[^[:space:];&|]+)*[[:space:]]+((-[a-zA-Z]*[rR][a-zA-Z]*|--recursive)([[:space:]]+[^[:space:];&|]+)*[[:space:]]+((~[A-Za-z_][A-Za-z0-9_.-]*|~|\$HOME|\$\{HOME\})(/\*{0,2})?)([[:space:];&|)`]|$)|((~[A-Za-z_][A-Za-z0-9_.-]*|~|\$HOME|\$\{HOME\})(/\*{0,2})?)([[:space:]]+[^[:space:];&|]+)*[[:space:]]+(-[a-zA-Z]*[rR][a-zA-Z]*|--recursive)([[:space:];&|)`]|$))	Catastrophic delete blocked — recursive rm of the home directory
(^|[;&|(`])[[:space:]]*((sudo|command|time|nohup|exec|env|xargs|eval|then|do|else)([[:space:]]+(-[uCghprtUDRnILPsdEaJSfo][[:space:]]+[^-[:space:];&|][^[:space:];&|]*|-[^[:space:];&|]*|[A-Za-z_][A-Za-z0-9_]*=[^[:space:];&|]*))*[[:space:]]+)*(\\|/(usr/)?bin/)?rm([[:space:]]+[^[:space:];&|]+)*[[:space:]]+((-[a-zA-Z]*[rR][a-zA-Z]*|--recursive)([[:space:]]+[^[:space:];&|]+)*[[:space:]]+(/(Users|home|etc|usr|bin|sbin|var|opt|System|Library|Applications|Volumes|private|root|boot|lib|dev|proc)(/\*{0,2})?)([[:space:];&|)`]|$)|(/(Users|home|etc|usr|bin|sbin|var|opt|System|Library|Applications|Volumes|private|root|boot|lib|dev|proc)(/\*{0,2})?)([[:space:]]+[^[:space:];&|]+)*[[:space:]]+(-[a-zA-Z]*[rR][a-zA-Z]*|--recursive)([[:space:];&|)`]|$))	Catastrophic delete blocked — recursive rm of a system directory
(^|[;&|(`])[[:space:]]*((sudo|command|time|nohup|exec|env|xargs|eval|then|do|else)([[:space:]]+(-[uCghprtUDRnILPsdEaJSfo][[:space:]]+[^-[:space:];&|][^[:space:];&|]*|-[^[:space:];&|]*|[A-Za-z_][A-Za-z0-9_]*=[^[:space:];&|]*))*[[:space:]]+)*(\\|/(usr/)?bin/)?find([[:space:]]+-[HLP])*([[:space:]]+[^-[:space:];&|][^[:space:];&|]*)*[[:space:]]+(/+\*{0,2}|(~[A-Za-z_][A-Za-z0-9_.-]*|~|\$HOME|\$\{HOME\})(/\*{0,2})?|/(Users|home|etc|usr|bin|sbin|var|opt|System|Library|Applications|Volumes|private|root|boot|lib|dev|proc)(/\*{0,2})?)([[:space:]]+([^-[:space:];&|][^[:space:];&|]*|-(mount|xdev|depth|noleaf|follow|ignore_readdir_race)|-(type|maxdepth|mindepth)[[:space:]]+[^[:space:];&|]+))*[[:space:]]+(-delete([[:space:];&|)`]|$)|-exec(dir)?[[:space:]]+(\\|/(usr/)?bin/)?rm([[:space:];&|)`]|$))	Catastrophic delete blocked — find -delete or -exec rm from the root, home or a system directory with no name, path or time predicate to scope it

# ── SQL destructive statements (no anchor — must catch inside psql heredocs) ──
DROP[[:space:]]+(TABLE|DATABASE|SCHEMA)[[:space:]]	Destructive DDL blocked — confirm with user before dropping
DELETE[[:space:]]+FROM[[:space:]]+[[:alnum:]_]+[[:space:]]*;	Unscoped DELETE blocked — this would affect all rows, add a WHERE clause
TRUNCATE[[:space:]]+TABLE	Irreversible truncate blocked — confirm with user before truncating

# ── Code execution from untrusted network sources ─────────────────────────────
(^|[[:space:]]*(&&|\|\||;)[[:space:]]*)(curl|wget)[[:space:]]+[^[:space:]]+.*\|[[:space:]]*(ba)?sh	Pipe-to-shell blocked — download and review the script before executing

# ── Broad permission grants ───────────────────────────────────────────────────
(^|[[:space:]]*(&&|\|\||;)[[:space:]]*)chmod[[:space:]]+-R[[:space:]]+777	chmod -R 777 blocked — grants world-write access recursively; use targeted permissions (e.g. chmod 755) instead

# ── Disk device operations ────────────────────────────────────────────────────
(^|[[:space:]]*(&&|\|\||;)[[:space:]]*)dd[[:space:]]+if=/dev/	dd from block device blocked — can wipe or clone disks; confirm with user before any raw device operation

# ── Known limitation (not a pattern — comment only) ──────────────────────────
# eval-based indirection (e.g. CMD="git push --force"; eval "$CMD") bypasses all
# static pattern matching above. This is an inherent limitation of text-based
# guards. For high-security environments, supplement with branch protection
# rules and code review rather than relying solely on this guard.
#
# Variables other than HOME ($B, "$DIR") are not blocked: an empty or unset
# variable cannot be known statically, so rm -rf "$B"/ is allowed. Only the
# literal targets in the rm rule above are judged (root, home, and the system
# directories listed; subpaths such as /tmp/x or /Users/kai/x are allowed).
