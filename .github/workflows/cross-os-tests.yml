name: Cross-OS Tests

# NFR-003: run the shell-layer test suites on Linux, macOS, and Windows for every
# relevant PR, so a portability regression is caught before merge instead of being
# discovered by a user. `push` to main is included too so main stays green.
on:
  pull_request:
  push:
    branches: [main]

  # Reused by release.yml so a v* tag is gated on exactly the suite that gates a PR.
  workflow_call:

jobs:
  test:
    name: test (${{ matrix.os }}, node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    # The Windows leg is informational today: its checkout has no exec bits and CRLF line
    # endings, and ~76 latent test failures across guards/lifecycle/adapters depend on both.
    # Those tests never ran on CI before the scoped runner landed (a quoted glob failed on
    # Node <21 before any test could), so this debt predates that fix. Stabilize Windows via
    # the tracking issue, then flip this back to a hard gate.
    continue-on-error: ${{ matrix.os == 'windows-latest' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: ["20"]
        # package.json declares engines.node >=18, so the floor is exercised too — otherwise the
        # supported minimum is only asserted, never tested. One OS is enough for a version sweep;
        # the OS matrix above already covers the portability axis.
        include:
          - os: ubuntu-latest
            node: "18"
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}

      # No package-lock.json is committed, so `npm ci` isn't available; `npm install`
      # is the correct equivalent here.
      - name: Install dependencies
        run: npm install

      - name: Run Node test suite
        run: npm test

      # jq ships preinstalled on all three GitHub-hosted runner images
      # (ubuntu-latest, macos-latest, windows-latest), so no install step is needed.
      #
      # `shell: bash` resolves to Git Bash on windows-latest (bundled with Git for
      # Windows) and to the native bash on ubuntu-latest/macos-latest, so these
      # scripts run the same interpreter on all three OSes.
      - name: Run doflow-chain-test.sh
        # Informational this release: the shell suites had never executed in CI before
        # the scoped runner landed, and their first ubuntu runs surfaced latent portability
        # debt (detached-HEAD branch expectations, fixture/hash divergence). Stabilize via
        # the tracking issue, then remove these continue-on-error markers.
        continue-on-error: true
        shell: bash
        run: bash test/doflow-chain-test.sh

      - name: Run test-hooks.sh
        # Informational this release: the shell suites had never executed in CI before
        # the scoped runner landed, and their first ubuntu runs surfaced latent portability
        # debt (detached-HEAD branch expectations, fixture/hash divergence). Stabilize via
        # the tracking issue, then remove these continue-on-error markers.
        continue-on-error: true
        shell: bash
        run: bash test/hooks/test-hooks.sh

      - name: Run verify-hooks.sh
        # Informational this release: the shell suites had never executed in CI before
        # the scoped runner landed, and their first ubuntu runs surfaced latent portability
        # debt (detached-HEAD branch expectations, fixture/hash divergence). Stabilize via
        # the tracking issue, then remove these continue-on-error markers.
        continue-on-error: true
        shell: bash
        run: bash test/verify-hooks.sh
