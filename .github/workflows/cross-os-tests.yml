name: Cross-OS Tests

# NFR-003: run the shell-layer test suites on Linux, macOS, and Windows for every
# relevant PR, so a portability regression is caught before merge instead of being
# discovered by a user. `push` to main is included too so main stays green.
on:
  pull_request:
  push:
    branches: [main]

  # Reused by release.yml so a v* tag is gated on exactly the suite that gates a PR.
  workflow_call:
    inputs:
      os_matrix:
        description: "JSON array of GitHub runners to run the suite on"
        required: false
        type: string
        default: '["ubuntu-latest", "macos-latest", "windows-latest"]'

# A new push to a PR cancels that PR's older run (the pattern prettier, vite and pnpm use).
# Every other event gets a group of its own (run_id), so a main push or a release tag is never
# cancelled, and a workflow_call cannot collide with its caller.
concurrency:
  group: cross-os-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: test (${{ matrix.os }}, node ${{ matrix.node }}, shard ${{ matrix.shard }}/4)
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    # Windows leg status: the exec-bit refusals, CRLF parse failures and $HOME redirection
    # bugs are FIXED (#40/#42), but the FR-001/009 dispatcher-spawn class remains FLAKY at
    # runner level — identical code passes some runs and fails others. So this leg is
    # non-blocking, runs only on pushes to main (never on PRs), and the release caller drops
    # windows from its matrix entirely. Tracked on the Windows-gate issue (#11).
    continue-on-error: ${{ matrix.os == 'windows-latest' }}
    strategy:
      fail-fast: false
      matrix:
        # `inputs` (and its default) exists only for workflow_call; on pull_request/push it is
        # empty. PRs skip the non-blocking Windows leg; a push to main still runs it.
        os: ${{ fromJSON(inputs.os_matrix || (github.event_name == 'pull_request' && '["ubuntu-latest","macos-latest"]' || '["ubuntu-latest","macos-latest","windows-latest"]')) }}
        node: ["24"]
        # node --test --test-shard splits the test files across parallel jobs; the slowest leg
        # (one runner running all 357 files) used to set the wall time.
        shard: [1, 2, 3, 4]
        # package.json declares engines.node ^22.18.0 || >=24.3.0, so its lowest release (22.18.0) is exercised too — otherwise the
        # supported minimum is only asserted, never tested. One OS is enough for a version sweep;
        # the OS matrix above already covers the portability axis.
        include:
          - { os: ubuntu-latest, node: "22.18.0", shard: 1 }
          - { os: ubuntu-latest, node: "22.18.0", shard: 2 }
          - { os: ubuntu-latest, node: "22.18.0", shard: 3 }
          - { os: ubuntu-latest, node: "22.18.0", shard: 4 }
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Full history and tags: test/e2e/register-followups.e2e.test.js compares against the v1.12.0 tag,
          # and test/e2e/lifecycle-loop.e2e.test.js against v1.13.0 (it skips, naming the tag, when it is absent).
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}

      # No package-lock.json is committed, so `npm ci` isn't available; `npm install`
      # is the correct equivalent here.
      - name: Install dependencies
        run: npm install

      # The same file set as `npm test`, one quarter of it per job.
      - name: Run Node test suite (shard ${{ matrix.shard }}/4)
        run: node --test --test-shard=${{ matrix.shard }}/4 "test/**/*.test.js"

  # The bash suites are a dedicated required job rather than per-OS steps: they are POSIX-only
  # by design, and isolating them on ubuntu makes a failure attributable to the suite that
  # failed instead of drowning in the three-OS matrix. code-review-fixtures.sh drives
  # do-code-review's Python analyzers; python3 is preinstalled on ubuntu-latest.
  shell-suites:
    name: shell-suites (ubuntu, bash)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install

      - name: Run doflow-chain-test.sh
        run: bash test/doflow-chain-test.sh

      - name: Run test-hooks.sh
        run: bash test/hooks/test-hooks.sh

      # Informational, not required: this suite already fails on today's ubuntu runners and on
      # macOS checkouts alike, independent of this branch (its step was continue-on-error inside
      # the old matrix too). Known-failing cases, from the latest main run's log and locally:
      #   - post-edit-lint: "expected 4 paths in edited-files.txt, found 0"
      #   - subagent-audit: TODO detection exits before writing ("stat /tmp/baz.go: no such file")
      #   - pre-compact: last-compact-summary.md not created / missing frontmatter
      #   - session-end: session directory not removed, END marker missing from sessions.log
      #   - meta.json: fails where the harness's canonicalized CWD differs from the hook's
      #     canonicalize_path (macOS /tmp symlink) — a fixture/runtime hash divergence.
      # Stabilize the suite first (same tracking issue as the Windows gate), then drop this flag.
      - name: Run verify-hooks.sh
        continue-on-error: true
        run: bash test/verify-hooks.sh

      - name: Run code-review-fixtures.sh
        run: bash test/code-review-fixtures.sh
