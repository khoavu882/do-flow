name: Cross-OS Tests

# NFR-003: run the shell-layer test suites on Linux, macOS, and Windows for every
# relevant PR, so a portability regression is caught before merge instead of being
# discovered by a user. `push` to main is included too so main stays green.
on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "20"

      # No package-lock.json is committed, so `npm ci` isn't available; `npm install`
      # is the correct equivalent here.
      - name: Install dependencies
        run: npm install

      - name: Run Node test suite
        run: npm test

      # jq ships preinstalled on all three GitHub-hosted runner images
      # (ubuntu-latest, macos-latest, windows-latest), so no install step is needed.
      #
      # `shell: bash` resolves to Git Bash on windows-latest (bundled with Git for
      # Windows) and to the native bash on ubuntu-latest/macos-latest, so these
      # scripts run the same interpreter on all three OSes.
      - name: Run doflow-chain-test.sh
        shell: bash
        run: bash test/doflow-chain-test.sh

      - name: Run test-hooks.sh
        shell: bash
        run: bash test/hooks/test-hooks.sh

      - name: Run verify-hooks.sh
        shell: bash
        run: bash test/verify-hooks.sh
