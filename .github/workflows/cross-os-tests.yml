name: Cross-OS Tests

# NFR-003: run the shell-layer test suites on Linux, macOS, and Windows for every
# relevant PR, so a portability regression is caught before merge instead of being
# discovered by a user. `push` to main and develop is included too so both stay green.
on:
  pull_request:
  push:
    branches: [main, develop]

  # On-demand run of chosen runners (e.g. only Windows) against any ref: gh workflow run cross-os-tests.yml --ref <branch> -f os_matrix='["windows-latest"]'
  workflow_dispatch:
    inputs:
      os_matrix:
        description: "JSON array of GitHub runners to run the suite on"
        required: false
        type: string
        default: '["windows-latest"]'

  # Reused by release.yml so a v* tag is gated on exactly the suite that gates a PR.
  workflow_call:
    inputs:
      os_matrix:
        description: "JSON array of GitHub runners to run the suite on"
        required: false
        type: string
        default: '["ubuntu-latest", "macos-latest", "windows-latest"]'

# One group per event and ref: a newer push to a branch or PR cancels that ref's older run, so
# a stack of pushes costs one finished run (the pattern prettier, vite and pnpm use). A tag is
# never cancelled (release.yml calls this workflow on `v*`; there github.ref is the tag), and a
# dispatch is an explicit request, so it queues instead of cancelling a push run.
# The group name starts with this workflow's own prefix rather than github.workflow, because in a
# workflow_call github.workflow is the caller's name and could collide with a group the caller adds.
# A release push to main is NOT skipped. The main reason: release.yml calls this workflow with
# ubuntu and macOS only, so the push-to-main run is the only Windows run a release commit gets.
# Also, the tag usually arrives after the main push, so at main-push time nothing says release.yml
# will test that commit, and a skip rule keyed on the tag would pass untested commits whenever
# the order flips.
concurrency:
  group: cross-os-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || (github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/')) }}

jobs:
  # The runtime executes by type-stripping, so a type error fails no test; this job is where it fails.
  # It has no `needs`, so it runs beside the shards on one ubuntu runner instead of inside each of them.
  typecheck:
    name: typecheck (ubuntu, node 24.22.1)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "24.22.1"

      - name: Install dependencies
        run: npm install

      - name: Typecheck
        run: npm run typecheck

  test:
    name: test (${{ matrix.os }}, node ${{ matrix.node }}, shard ${{ matrix.shard }}/4)
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    # Windows leg status: the exec-bit refusals, CRLF parse failures and $HOME redirection
    # bugs are FIXED (#40/#42), but the FR-001/009 dispatcher-spawn class remains FLAKY at
    # runner level — identical code passes some runs and fails others. So this leg is
    # non-blocking, runs only on pushes to main (never on PRs), and the release caller drops
    # windows from its matrix entirely. Tracked on the Windows-gate issue (#11).
    continue-on-error: ${{ matrix.os == 'windows-latest' }}
    strategy:
      fail-fast: false
      matrix:
        # `inputs` (and its default) exists only for workflow_call; on pull_request/push it is
        # empty. PRs skip the non-blocking Windows leg; a push to main still runs it.
        # TEMP-ISSUE-11: windows-latest added to the PR list for the fix/issue-11-windows PR only; remove before merge.
        os: ${{ fromJSON(inputs.os_matrix || (github.event_name == 'pull_request' && '["ubuntu-latest","macos-latest","windows-latest"]' || '["ubuntu-latest","macos-latest","windows-latest"]')) }}
        # engines.node is >=24.22.1 and bin/doflow.js refuses anything older, so every leg runs exactly the floor.
        # A bare "24" resolves to the runner's cached 24.x, which can be older than the floor.
        node: ["24.22.1"]
        # node --test --test-shard splits the test files across parallel jobs; the slowest leg
        # (one runner running all 357 files) used to set the wall time.
        shard: [1, 2, 3, 4]
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Full history and tags: test/e2e/register-followups.e2e.test.ts compares against the v1.12.0 tag,
          # and test/e2e/lifecycle-loop.e2e.test.ts against v1.13.0 (it skips, naming the tag, when it is absent).
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}

      # No package-lock.json is committed, so `npm ci` isn't available; `npm install`
      # is the correct equivalent here.
      - name: Install dependencies
        run: npm install

      # The same file set as `npm test`, one quarter of it per job.
      - name: Run Node test suite (shard ${{ matrix.shard }}/4)
        run: node --test --test-shard=${{ matrix.shard }}/4 "test/**/*.test.ts"

  # The bash suites are a dedicated required job rather than per-OS steps: they are POSIX-only
  # by design, and isolating them on ubuntu makes a failure attributable to the suite that
  # failed instead of drowning in the three-OS matrix. code-review-fixtures.sh drives
  # do-code-review's Python analyzers; python3 is preinstalled on ubuntu-latest.
  shell-suites:
    name: shell-suites (ubuntu, bash)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "24.22.1"

      - name: Install dependencies
        run: npm install

      - name: Run doflow-chain-test.sh
        run: bash test/doflow-chain-test.sh

      - name: Run test-hooks.sh
        run: bash test/hooks/test-hooks.sh

      - name: Run verify-hooks.sh
        run: bash test/verify-hooks.sh

      - name: Run code-review-fixtures.sh
        run: bash test/code-review-fixtures.sh
