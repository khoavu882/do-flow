name: Windows Probe (TEMP issue 11)
on:
  pull_request:
jobs:
  probe:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24.22.1"
      - run: npm install
      - name: probe
        shell: bash
        run: bash .probe/run.sh
