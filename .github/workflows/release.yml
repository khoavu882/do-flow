name: Release

# A tag is the release. Before v1.0.0 nothing ran on tag creation, so `v*` could be cut from a
# commit that had never passed the Windows leg of cross-os-tests. This makes the tag itself the
# gate: tests first, and the publish/release jobs only run if that job succeeds.
on:
  push:
    tags: ["v*"]

permissions: {}

jobs:
  preflight:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: npm run release:preflight -- --tag "$GITHUB_REF_NAME" --tag-pushed

  # Reuses the PR suite verbatim rather than restating it, so the two can never drift.
  test:
    uses: ./.github/workflows/cross-os-tests.yml
    with:
      # Required legs only. Job-level continue-on-error inside a reusable workflow does NOT
      # soften the caller's conclusion, so the flaky windows leg must simply be absent from
      # the release gate (v1.1.0's first tag attempt was blocked by it).
      os_matrix: '["ubuntu-latest", "macos-latest"]'
    permissions:
      contents: read

  verify-artifact:
    needs: [preflight, test]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: npm run build:package
      - name: Fail if the tarball carries backup or editor artifacts
        run: |
          npm pack --dry-run .pack 2>&1 | tee /tmp/pack.txt
          if grep -Eq '\.(bak|orig|rej|swp|tmp)$|\.DS_Store|__pycache__' /tmp/pack.txt; then
            echo "::error::npm tarball contains artifacts that must not ship"
            exit 1
          fi

  draft-release:
    needs: [verify-artifact]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      # `--generate-notes` lists merged pull requests; this repo merges locally, so it produced a
      # bare compare link. The tagged version's CHANGELOG.md section supplies the release notes.
      - run: npm run release-notes --silent -- "$GITHUB_REF_NAME" > notes.md
      - name: Create draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          prerelease=""
          case "$GITHUB_REF_NAME" in *-*) prerelease="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" \
            --draft \
            --title "$GITHUB_REF_NAME" \
            --notes-file notes.md \
            $prerelease

  publish:
    needs: [draft-release]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      # Publish prereleases under a candidate tag until verify-registry passes. Stable releases
      # use the latest channel only when promote moves it after verification.
      - name: Derive candidate channel
        run: |
          case "$GITHUB_REF_NAME" in
            *-*) channel=beta ;;
            *) channel=latest ;;
          esac
          echo "channel=$channel" >> "$GITHUB_ENV"
      - run: npm run build:package
      - name: Publish candidate to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish .pack --provenance --tag "${channel}-candidate"

  verify-registry:
    needs: [publish]
    runs-on: ${{ matrix.os }}
    permissions: {}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            node: "24.22.1"
          - os: macos-latest
            node: "24"
    steps:
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
      - name: Wait for the published version
        run: |
          VER="${GITHUB_REF_NAME#v}"
          attempt=1
          while [ "$attempt" -le 10 ]; do
            if published="$(npm view "@khoavu882/doflow@$VER" version 2>/dev/null)" \
              && [ "$published" = "$VER" ]; then
              break
            fi
            if [ "$attempt" -eq 10 ]; then
              echo "::error::@khoavu882/doflow@$VER did not appear on npm after 10 tries"
              exit 1
            fi
            sleep 15
            attempt=$((attempt + 1))
          done
          npm install --prefix "$RUNNER_TEMP/prefix" "@khoavu882/doflow@$VER"
      - name: Verify installed package in an isolated HOME
        env:
          HOME: ${{ runner.temp }}/home
          XDG_CONFIG_HOME: ${{ runner.temp }}/xdg
        run: |
          mkdir -p "$HOME" "$XDG_CONFIG_HOME"
          export PATH="$RUNNER_TEMP/prefix/node_modules/.bin:$PATH"
          VER="${GITHUB_REF_NAME#v}"
          installed="$(doflow --version)"
          if [ "$installed" != "$VER" ]; then
            echo "::error::installed version $installed does not match tag version $VER"
            exit 1
          fi
          doflow install -g -f --no-backup -t claude
          bash "$HOME/.claude/bin/doflow-run" paths --json \
            | node -e 'let input = ""; process.stdin.on("data", (chunk) => input += chunk); process.stdin.on("end", () => JSON.parse(input));'

  promote:
    needs: [verify-registry]
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Promote verified version
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          VER="${GITHUB_REF_NAME#v}"
          case "$GITHUB_REF_NAME" in
            *-*) channel=beta ;;
            *) channel=latest ;;
          esac
          npm dist-tag add "@khoavu882/doflow@$VER" "$channel"
          npm dist-tag rm @khoavu882/doflow "${channel}-candidate"

  publish-release:
    needs: [promote]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "$GITHUB_REF_NAME" --draft=false --repo "$GITHUB_REPOSITORY"
