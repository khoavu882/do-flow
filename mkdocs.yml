site_name: DoFlow
site_description: >
  A configuration layer giving AI coding assistants persistent memory,
  specialist expertise, and production-grade safety guardrails —
  across Claude Code, Codex, Gemini, OpenCode, Pi, Copilot CLI, Kiro,
  and Antigravity.
site_url: https://khoavu882.github.io/do-flow
repo_url: https://github.com/khoavu882/do-flow
repo_name: khoavu882/do-flow
edit_uri: edit/main/

theme:
  name: dracula

plugins:
  - search

# Mermaid: the dracula theme ships no diagram support, so each ```mermaid fence becomes
# <div class="mermaid"> and the pinned mermaid build below renders it in the browser.
markdown_extensions:
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_div_format

extra_javascript:
  - https://cdn.jsdelivr.net/npm/mermaid@11.17.2/dist/mermaid.min.js
  - javascripts/mermaid-init.js

nav:
  - Home: index.md
  - Overview: overview.md
  - How DoFlow works: how-doflow-work.md
  - Quickstart: quickstart.md
  - Setup: setup.md
  - Guide: guide.md
  - Reference: reference.md
  - Flags: flags.md
  - Capability Map: capability-map.md
  - Enterprise governance: enterprise-governance.md
  - Distribution notes: distribution-notes.md
  - Architecture: architecture.md
  - Refactor plan: refactor-plan.md
  - Orchestrator spec: specs/orchestrator-context-modes.md
