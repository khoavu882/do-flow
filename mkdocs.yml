site_name: DoFlow
site_description: >
  A configuration layer giving AI coding assistants persistent memory,
  specialist expertise, and production-grade safety guardrails —
  across Claude Code, Codex, Gemini, OpenCode, Pi, Copilot CLI, Kiro,
  and Antigravity.
site_url: https://khoavu882.github.io/do-flow
repo_url: https://github.com/khoavu882/do-flow
repo_name: khoavu882/do-flow
edit_uri: edit/main/

theme:
  name: dracula

plugins:
  - search

# Mermaid: the dracula theme ships no diagram support, so each ```mermaid fence becomes
# <div class="mermaid"> and javascripts/mermaid-init.js loads the pinned, integrity-checked mermaid
# build on pages that hold one and renders it in the browser.
markdown_extensions:
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_div_format

extra_javascript:
  - javascripts/mermaid-init.js

nav:
  - Home: index.md
  - Get started:
      - Quickstart: quickstart.md
      - Setup: setup.md
  - Use DoFlow:
      - Guide: guide.md
      - How DoFlow works: how-doflow-work.md
      - Harnesses: capability-map.md
      - Governance: enterprise-governance.md
  - Reference:
      - Commands and skills: reference.md
      - Settings: settings.md
      - Flags: flags.md
  - Contributing:
      - Architecture: architecture.md
      - Distribution notes: distribution-notes.md
      - Specs:
          - Orchestrator context modes: specs/orchestrator-context-modes.md
          - Operating modes: specs/operating-modes.md
          - Candidate evidence boundary: specs/candidate-evidence-boundary.md
          - Telemetry contract: specs/telemetry-contract.md

not_in_nav: |
  /overview.md
  /refactor-plan.md

validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn
  anchors: warn
