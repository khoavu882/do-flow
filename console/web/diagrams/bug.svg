<svg xmlns="http://www.w3.org/2000/svg" class="pele pele-flowchart" viewBox="0 0 940 88" width="940" height="88" style="max-width:100%;height:auto;--_bg:var(--pele-bg,#fff);--_fg:var(--pele-fg,#1f1f1f);--_m:var(--pele-muted,#6e6e6e);--_l:var(--pele-line,#1f1f1f);--_s:var(--pele-surface,#f3f3f3);--_a:var(--pele-surface-alt,#e6e6e6);--_b:var(--pele-border,#8a8a8a);--_c:var(--pele-accent,#5b7bd5);color:var(--_fg);--_fm:var(--pele-font-mono,monospace);font:16px sans-serif;letter-spacing:normal;word-spacing:normal;text-transform:none;direction:ltr;font-family:var(--pele-font,sans-serif)" fill="var(--_fg)" role="graphics-document document" aria-roledescription="flowchart" aria-labelledby="bug-title" aria-describedby="bug-desc"><title id="bug-title">Bug Fix</title><desc id="bug-desc">1. reproduction (do-test): Run the failing case and record the observed failure as evidence before explaining it.
2. root-cause (do-diagnose): Establish the root cause and its blast radius from repository evidence, not from the first plausible explanation.
3. implementation (do-implement): Apply the targeted fix for the established root cause.
4. regression-verification (do-test): Re-run the reproduction and the surrounding suite to show the defect is gone and nothing else broke.
5. review (do-code-review) [optional]: Review the fix when its blast radius reaches beyond the reproduction.</desc><g class="pele-edges" fill="none" stroke="var(--_l)" stroke-linecap="round"><g class="pele-edge" data-id="L_s0_s1_0"><path d="M132.93,44L173.93,44"/><path class="pele-marker" d="M180.93,44L172.93,47.36L172.93,40.64Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge" data-id="L_s1_s2_0"><path d="M304.98,44L345.98,44"/><path class="pele-marker" d="M352.98,44L344.98,47.36L344.98,40.64Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge" data-id="L_s2_s3_0"><path d="M497.46,44L538.46,44"/><path class="pele-marker" d="M545.46,44L537.46,47.36L537.46,40.64Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge" data-id="L_s3_s4_0"><path d="M737.94,44L778.94,44"/><path class="pele-marker" d="M785.94,44L777.94,47.36L777.94,40.64Z" fill="var(--_l)" stroke="none"/></g></g><g class="pele-nodes"><g class="pele-node pele-shape-rounded" data-id="s0" transform="translate(70.46,44)"><rect x="-62.46" y="-36" width="124.93" height="72" rx="12" fill="var(--_s)" stroke="var(--_b)"/><text class="pele-label" text-anchor="middle" xml:space="preserve"><tspan x="0" y="-6.4">reproduction</tspan><tspan x="0" y="17.6">do-test</tspan></text></g><g class="pele-node pele-shape-rounded" data-id="s1" transform="translate(242.95,44)"><rect x="-62.02" y="-36" width="124.05" height="72" rx="12" fill="var(--_s)" stroke="var(--_b)"/><text class="pele-label" text-anchor="middle" xml:space="preserve"><tspan x="0" y="-6.4">root-cause</tspan><tspan x="0" y="17.6">do-diagnose</tspan></text></g><g class="pele-node pele-shape-rounded" data-id="s2" transform="translate(425.22,44)"><rect x="-72.24" y="-36" width="144.48" height="72" rx="12" fill="var(--_s)" stroke="var(--_b)"/><text class="pele-label" text-anchor="middle" xml:space="preserve"><tspan x="0" y="-6.4">implementation</tspan><tspan x="0" y="17.6">do-implement</tspan></text></g><g class="pele-node pele-shape-rounded" data-id="s3" transform="translate(641.7,44)"><rect x="-96.24" y="-36" width="192.48" height="72" rx="12" fill="var(--_s)" stroke="var(--_b)"/><text class="pele-label" text-anchor="middle" xml:space="preserve"><tspan x="0" y="-6.4">regression-verification</tspan><tspan x="0" y="17.6">do-test</tspan></text></g><g class="pele-node pele-shape-rounded optional" data-id="s4" transform="translate(858.62,44)"><rect x="-72.68" y="-36" width="145.36" height="72" rx="12" fill="var(--_s)" stroke="var(--_b)" style="stroke-dasharray:5 3;"/><text class="pele-label" text-anchor="middle" xml:space="preserve"><tspan x="0" y="-6.4">review</tspan><tspan x="0" y="17.6">do-code-review</tspan></text></g></g></svg>
