<svg xmlns="http://www.w3.org/2000/svg" class="pele pele-flowchart" viewBox="0 0 1935 190" width="1935" height="190" style="max-width:100%;height:auto;--_bg:var(--pele-bg,#fff);--_fg:var(--pele-fg,#1f1f1f);--_m:var(--pele-muted,#6e6e6e);--_l:var(--pele-line,#1f1f1f);--_s:var(--pele-surface,#f3f3f3);--_a:var(--pele-surface-alt,#e6e6e6);--_b:var(--pele-border,#8a8a8a);--_c:var(--pele-accent,#5b7bd5);color:var(--_fg);--_fm:var(--pele-font-mono,monospace);font:16px sans-serif;letter-spacing:normal;word-spacing:normal;text-transform:none;direction:ltr;font-family:var(--pele-font,sans-serif)" fill="var(--_fg)" role="graphics-document document" aria-roledescription="flowchart" aria-labelledby="feature-title" aria-describedby="feature-desc"><title id="feature-title">Feature Delivery</title><desc id="feature-desc">1. discovery (do-brainstorm): Resolve the idea into requirement.md with zero unresolved clarification markers.
2. design (do-design): Turn requirement.md into architecture, interface, and data-contract decisions in design.md.
3. planning (do-plan): Produce plan.md: the constitution check and the dependency-ordered task checklist.
4. implementation (do-execute-plan): Execute plan.md's checklist through the specialist archetypes.
5. verification (do-test): Run the project's builds and test suites over the delivered change.
6. review (do-code-review): Review the delivered change and report an approval status.</desc><g class="pele-edges" fill="none" stroke="var(--_l)" stroke-linecap="round"><g class="pele-edge" data-id="L_s0_g0_0_0"><path d="M142.69,94.63L183.69,94.63"/><path class="pele-marker" d="M190.69,94.63L182.69,97.99L182.69,91.27Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge" data-id="L_g0_0_s1_0"><path d="M436.06,94.63L477.06,94.63"/><path class="pele-marker" d="M484.06,94.63L476.06,97.99L476.06,91.27Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge" data-id="L_s1_s2_0"><path d="M590.32,94.63L631.32,94.63"/><path class="pele-marker" d="M638.32,94.63L630.32,97.99L630.32,91.27Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge" data-id="L_s2_g2_0_0"><path d="M734.8,94.63L775.8,94.63"/><path class="pele-marker" d="M782.8,94.63L774.8,97.99L774.8,91.27Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge" data-id="L_g2_0_s3_0"><path d="M1048.46,94.63L1089.46,94.63"/><path class="pele-marker" d="M1096.46,94.63L1088.46,97.99L1088.46,91.27Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge" data-id="L_s3_s4_0"><path d="M1247.18,94.63L1288.18,94.63"/><path class="pele-marker" d="M1295.18,94.63L1287.18,97.99L1287.18,91.27Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge" data-id="L_s4_s5_0"><path d="M1407.65,94.63L1448.65,94.63"/><path class="pele-marker" d="M1455.65,94.63L1447.65,97.99L1447.65,91.27Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge" data-id="L_s5_g5_0_0"><path d="M1601.01,94.63L1642.01,94.63"/><path class="pele-marker" d="M1649.01,94.63L1641.01,97.99L1641.01,91.27Z" fill="var(--_l)" stroke="none"/></g></g><g class="pele-nodes"><g class="pele-node pele-shape-rounded" data-id="s0" transform="translate(75.34,94.63)"><rect x="-67.34" y="-36" width="134.69" height="72" rx="12" fill="var(--_s)" stroke="var(--_b)"/><text class="pele-label" text-anchor="middle" xml:space="preserve"><tspan x="0" y="-6.4">discovery</tspan><