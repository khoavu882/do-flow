<svg xmlns="http://www.w3.org/2000/svg" class="pele pele-flowchart" viewBox="0 0 901 88" width="901" height="88" style="max-width:100%;height:auto;--_bg:var(--pele-bg,#fff);--_fg:var(--pele-fg,#1f1f1f);--_m:var(--pele-muted,#6e6e6e);--_l:var(--pele-line,#1f1f1f);--_s:var(--pele-surface,#f3f3f3);--_a:var(--pele-surface-alt,#e6e6e6);--_b:var(--pele-border,#8a8a8a);--_c:var(--pele-accent,#5b7bd5);color:var(--_fg);--_fm:var(--pele-font-mono,monospace);font:16px sans-serif;letter-spacing:normal;word-spacing:normal;text-transform:none;direction:ltr;font-family:var(--pele-font,sans-serif)" fill="var(--_fg)" role="graphics-document document" aria-roledescription="flowchart" aria-labelledby="dependency-change-title" aria-describedby="dependency-change-desc"><title id="dependency-change-title">Dependency Change</title><desc id="dependency-change-desc">1. release-evidence (do-document): Retrieve the upstream release notes, changelog, and migration guide for the exact version range, and record them with their sources.
2. usage-impact (do-diagnose): Map every repository usage of the dependency against the documented breaking changes.
3. implementation (do-implement): Apply the version change and the call-site migrations the evidence identified.
4. verification (do-test): Run the build and full suite: a dependency change's blast radius is not bounded by the diff.
5. review (do-code-review) [optional]: Review the migrated call sites when the upgrade crossed a breaking change.</desc><g class="pele-edges" fill="none" stroke="var(--_l)" stroke-linecap="round"><g class="pele-edge" data-id="L_s0_s1_0"><path d="M165.82,44L206.82,44"/><path class="pele-marker" d="M213.82,44L205.82,47.36L205.82,40.64Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge" data-id="L_s1_s2_0"><path d="M345.86,44L386.86,44"/><path class="pele-marker" d="M393.86,44L385.86,47.36L385.86,40.64Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge" data-id="L_s2_s3_0"><path d="M538.34,44L579.34,44"/><path class="pele-marker" d="M586.34,44L578.34,47.36L578.34,40.64Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge" data-id="L_s3_s4_0"><path d="M698.8,44L739.8,44"/><path class="pele-marker" d="M746.8,44L738.8,47.36L738.8,40.64Z" fill="var(--_l)" stroke="none"/></g></g><g class="pele-nodes"><g class="pele-node pele-shape-rounded" data-id="s0" transform="translate(86.91,44)"><rect x="-78.91" y="-36" width="157.82" height="72" rx="12" fill="var(--_s)" stroke="var(--_b)"/><text class="pele-label" text-anchor="middle" xml:space="preserve"><tspan x="0" y="-6.4">release-evidence</tspan><tspan x="0" y="17.6">do-document</tspan></text></g><g class="pele-node pele-shape-rounded" data-id="s1" transform="translate(279.84,44)"><rect x="-66.02" y="-36" width="132.03" height="72" rx="12" fill="var(--_s)" stroke="var(--_b)"/><text class="pele-label" text-anchor="middle" xml:space="preserve"><tspan x="0" y="-6.4">usage-impact</tspan><tspan x="0" y="17.6">do-diagnose</tspan></text></g><g class="pele-node pele-shape-rounded" data-id="s2" transform="translate(466.1,44)"><rect x="-72.24" y="-36" width="144.48" height="72" rx="12" fill="var(--_s)" stroke="var(--_b)"/><text class="pele-label" text-anchor="middle" xml:space="preserve"><tspan x="0" y="-6.4">implementation</tspan><tspan x="0" y="17.6">do-implement</tspan></text></g><g class="pele-node pele-shape-rounded" data-id="s3" transform="translate(642.57,44)"><rect x="-56.23" y="-36" width="112.46" height="72" rx="12" fill="var(--_s)" stroke="var(--_b)"/><text class="pele-label" text-anchor="middle" xml:space="preserve"><tspan x="0" y="-6.4">verification</tspan><tspan x="0" y="17.6">do-test</tspan></text></g><g class="pele-node pele-shape-rounded optional" data-id="s4" transform="translate(819.48,44)"><rect x="-72.68" y="-36" width="145.36" height="72" rx="12" fill="var(--_s)" stroke="var(--_b)" style="stroke-dasharray:5 3;"/><text class="pele-label" text-anchor="middle" xml:space="preserve"><tspan x="0" y="-6.4">review</tspan><tspan x="0" y="17.6">do-code-review</tspan></text></g></g></svg>
