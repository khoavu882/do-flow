<svg xmlns="http://www.w3.org/2000/svg" class="pele pele-flowchart" viewBox="0 0 974 88" width="974" height="88" style="max-width:100%;height:auto;--_bg:var(--pele-bg,#fff);--_fg:var(--pele-fg,#1f1f1f);--_m:var(--pele-muted,#6e6e6e);--_l:var(--pele-line,#1f1f1f);--_s:var(--pele-surface,#f3f3f3);--_a:var(--pele-surface-alt,#e6e6e6);--_b:var(--pele-border,#8a8a8a);--_c:var(--pele-accent,#5b7bd5);color:var(--_fg);--_fm:var(--pele-font-mono,monospace);font:16px sans-serif;letter-spacing:normal;word-spacing:normal;text-transform:none;direction:ltr;font-family:var(--pele-font,sans-serif)" fill="var(--_fg)" role="graphics-document document" aria-roledescription="flowchart" aria-labelledby="refactor-title" aria-describedby="refactor-desc"><title id="refactor-title">Refactor</title><desc id="refactor-desc">1. architecture-mapping (do-diagnose): Map the current architecture and call graphs, state the invariants that must survive, and bound the blast radius.
2. baseline-verification (do-test): Record a green baseline before any edit, so a post-refactor failure is attributable.
3. implementation (do-implement): Restructure within the mapped blast radius while holding the captured invariants.
4. verification (do-test): Re-run the baseline suite and compare against the recorded baseline.
5. review (do-code-review): Confirm the restructuring preserved behavior and did not widen its own scope.</desc><g class="pele-edges" fill="none" stroke="var(--_l)" stroke-linecap="round"><g class="pele-edge" data-id="L_s0_s1_0"><path d="M194.27,44L235.27,44"/><path class="pele-marker" d="M242.27,44L234.27,47.36L234.27,40.64Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge" data-id="L_s1_s2_0"><path d="M419.65,44L460.65,44"/><path class="pele-marker" d="M467.65,44L459.65,47.36L459.65,40.64Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge" data-id="L_s2_s3_0"><path d="M612.13,44L653.13,44"/><path class="pele-marker" d="M660.13,44L652.13,47.36L652.13,40.64Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge" data-id="L_s3_s4_0"><path d="M772.59,44L813.59,44"/><path class="pele-marker" d="M820.59,44L812.59,47.36L812.59,40.64Z" fill="var(--_l)" stroke="none"/></g></g><g class="pele-nodes"><g class="pele-node pele-shape-rounded" data-id="s0" transform="translate(101.14,44)"><rect x="-93.14" y="-36" width="186.27" height="72" rx="12" fill="var(--_s)" stroke="var(--_b)"/><text class="pele-label" text-anchor="middle" xml:space="preserve"><tspan x="0" y="-6.4">architecture-mapping</tspan><tspan x="0" y="17.6">do-diagnose</tspan></text></g><g class="pele-node pele-shape-rounded" data-id="s1" transform="translate(330.96,44)"><rect x="-88.69" y="-36" width="177.38" height="72" rx="12" fill="var(--_s)" stroke="var(--_b)"/><text class="pele-label" text-anchor="middle" xml:space="preserve"><tspan x="0" y="-6.4">baseline-verification</tspan><tspan x="0" y="17.6">do-test</tspan></text></g><g class="pele-node pele-shape-rounded" data-id="s2" transform="translate(539.89,44)"><rect x="-72.24" y="-36" width="144.48" height="72" rx="12" fill="var(--_s)" stroke="var(--_b)"/><text class="pele-label" text-anchor="middle" xml:space="preserve"><tspan x="0" y="-6.4">implementation</tspan><tspan x="0" y="17.6">do-implement</tspan></text></g><g class="pele-node pele-shape-rounded" data-id="s3" transform="translate(716.36,44)"><rect x="-56.23" y="-36" width="112.46" height="72" rx="12" fill="var(--_s)" stroke="var(--_b)"/><text class="pele-label" text-anchor="middle" xml:space="preserve"><tspan x="0" y="-6.4">verification</tspan><tspan x="0" y="17.6">do-test</tspan></text></g><g class="pele-node pele-shape-rounded" data-id="s4" transform="translate(893.27,44)"><rect x="-72.68" y="-36" width="145.36" height="72" rx="12" fill="var(--_s)" stroke="var(--_b)"/><text class="pele-label" text-anchor="middle" xml:space="preserve"><tspan x="0" y="-6.4">review</tspan><tspan x="0" y="17.6">do-code-review</tspan></text></g></g></svg>
