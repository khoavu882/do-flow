<svg xmlns="http://www.w3.org/2000/svg" class="pele pele-flowchart" viewBox="0 0 500 88" width="500" height="88" style="max-width:100%;height:auto;--_bg:var(--pele-bg,#fff);--_fg:var(--pele-fg,#1f1f1f);--_m:var(--pele-muted,#6e6e6e);--_l:var(--pele-line,#1f1f1f);--_s:var(--pele-surface,#f3f3f3);--_a:var(--pele-surface-alt,#e6e6e6);--_b:var(--pele-border,#8a8a8a);--_c:var(--pele-accent,#5b7bd5);color:var(--_fg);--_fm:var(--pele-font-mono,monospace);font:16px sans-serif;letter-spacing:normal;word-spacing:normal;text-transform:none;direction:ltr;font-family:var(--pele-font,sans-serif)" fill="var(--_fg)" role="graphics-document document" aria-roledescription="flowchart" aria-labelledby="documentation-title" aria-describedby="documentation-desc"><title id="documentation-title">Documentation</title><desc id="documentation-desc">1. authoring (do-document): Write or update the documentation against the code, artifact or command it describes, carrying a locator for every factual claim. Never from memory, and never a figure nobody measured.
2. verification (do-test) [optional]: Run whatever the documentation can break — guards that read docs, link and example checks, or the suite when a documented command or snippet is executable. Skip only when the repository has no such check, and say that is why.
3. review (do-code-review) [optional]: Review the prose through the content-type path rather than the language checkers, when the change is large enough that a second read is worth its cost.</desc><g class="pele-edges" fill="none" stroke="var(--_l)" stroke-linecap="round"><g class="pele-edge" data-id="L_s0_s1_0"><path d="M137.38,44L178.38,44"/><path class="pele-marker" d="M185.38,44L177.38,47.36L177.38,40.64Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge" data-id="L_s1_s2_0"><path d="M297.84,44L338.84,44"/><path class="pele-marker" d="M345.84,44L337.84,47.36L337.84,40.64Z" fill="var(--_l)" stroke="none"/></g></g><g class="pele-nodes"><g class="pele-node pele-shape-rounded" data-id="s0" transform="translate(72.69,44)"><rect x="-64.69" y="-36" width="129.38" height="72" rx="12" fill="var(--_s)" stroke="var(--_b)"/><text class="pele-label" text-anchor="middle" xml:space="preserve"><tspan x="0" y="-6.4">authoring</tspan><tspan x="0" y="17.6">do-document</tspan></text></g><g class="pele-node pele-shape-rounded optional" data-id="s1" transform="translate(241.61,44)"><rect x="-56.23" y="-36" width="112.46" height="72" rx="12" fill="var(--_s)" stroke="var(--_b)" style="stroke-dasharray:5 3;"/><text class="pele-label" text-anchor="middle" xml:space="preserve"><tspan x="0" y="-6.4">verification</tspan><tspan x="0" y="17.6">do-test</tspan></text></g><g class="pele-node pele-shape-rounded optional" data-id="s2" transform="translate(418.52,44)"><rect x="-72.68" y="-36" width="145.36" height="72" rx="12" fill="var(--_s)" stroke="var(--_b)" style="stroke-dasharray:5 3;"/><text class="pele-label" text-anchor="middle" xml:space="preserve"><tspan x="0" y="-6.4">review</tspan><tspan x="0" y="17.6">do-code-review</tspan></text></g></g></svg>
