<svg xmlns="http://www.w3.org/2000/svg" class="pele pele-flowchart" viewBox="0 0 605 88" width="605" height="88" style="max-width:100%;height:auto;--_bg:var(--pele-bg,#fff);--_fg:var(--pele-fg,#1f1f1f);--_m:var(--pele-muted,#6e6e6e);--_l:var(--pele-line,#1f1f1f);--_s:var(--pele-surface,#f3f3f3);--_a:var(--pele-surface-alt,#e6e6e6);--_b:var(--pele-border,#8a8a8a);--_c:var(--pele-accent,#5b7bd5);color:var(--_fg);--_fm:var(--pele-font-mono,monospace);font:16px sans-serif;letter-spacing:normal;word-spacing:normal;text-transform:none;direction:ltr;font-family:var(--pele-font,sans-serif)" fill="var(--_fg)" role="graphics-document document" aria-roledescription="flowchart" aria-labelledby="operations-title" aria-describedby="operations-desc"><title id="operations-title">Operations</title><desc id="operations-desc">1. state-check (do-git): Establish current branch, working-tree cleanliness, and lifecycle position before acting.
2. preflight (do-test): Confirm the build and suite are green on the state being shipped.
3. execution (do-git): Perform the lifecycle intent with its confirmation and safety checks.
4. record (do-document) [optional]: Write the release note or operational record when the operation produced something worth citing later.</desc><g class="pele-edges" fill="none" stroke="var(--_l)" stroke-linecap="round"><g class="pele-edge" data-id="L_s0_s1_0"><path d="M125.81,44L166.81,44"/><path class="pele-marker" d="M173.81,44L165.81,47.36L165.81,40.64Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge" data-id="L_s1_s2_0"><path d="M266.72,44L307.72,44"/><path class="pele-marker" d="M314.72,44L306.72,47.36L306.72,40.64Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge" data-id="L_s2_s3_0"><path d="M419.2,44L460.2,44"/><path class="pele-marker" d="M467.2,44L459.2,47.36L459.2,40.64Z" fill="var(--_l)" stroke="none"/></g></g><g class="pele-nodes"><g class="pele-node pele-shape-rounded" data-id="s0" transform="translate(66.9,44)"><rect x="-58.9" y="-36" width="117.81" height="72" rx="12" fill="var(--_s)" stroke="var(--_b)"/><text class="pele-label" text-anchor="middle" xml:space="preserve"><tspan x="0" y="-6.4">state-check</tspan><tspan x="0" y="17.6">do-git</tspan></text></g><g class="pele-node pele-shape-rounded" data-id="s1" transform="translate(220.26,44)"><rect x="-46.46" y="-36" width="92.91" height="72" rx="12" fill="var(--_s)" stroke="var(--_b)"/><text class="pele-label" text-anchor="middle" xml:space="preserve"><tspan x="0" y="-6.4">preflight</tspan><tspan x="0" y="17.6">do-test</tspan></text></g><g class="pele-node pele-shape-rounded" data-id="s2" transform="translate(366.96,44)"><rect x="-52.24" y="-36" width="104.48" height="72" rx="12" fill="var(--_s)" stroke="var(--_b)"/><text class="pele-label" text-anchor="middle" xml:space="preserve"><tspan x="0" y="-6.4">execution</tspan><tspan x="0" y="17.6">do-git</tspan></text></g><g class="pele-node pele-shape-rounded optional" data-id="s3" transform="translate(531.89,44)"><rect x="-64.69" y="-36" width="129.38" height="72" rx="12" fill="var(--_s)" stroke="var(--_b)" style="stroke-dasharray:5 3;"